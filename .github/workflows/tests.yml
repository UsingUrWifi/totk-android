name: Source regressions

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # This job covers the legacy source tree, not the Android fork built on the experimental branch.
    if: github.ref_name != 'exp/totk-lowram-custom-touch' && github.head_ref != 'exp/totk-lowram-custom-touch'
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: games/totk/requirements.txt
      - name: Install build-tool test dependencies
        run: python -m pip install -r games/totk/requirements.txt
      - name: Run synthetic container, update and native path tests
        run: python -m unittest discover -s tests -v
      # UBSan only: on macOS 26 an AddressSanitizer build of this test hangs in dyld before main
      # (AsanInitInternal -> StaticSpinMutex::LockSlow), which would hold the job until its timeout.
      - name: Check native path parser with the undefined-behavior sanitizer
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all tests/test_romfs_paths.c -o "$RUNNER_TEMP/test-romfs-paths"
          "$RUNNER_TEMP/test-romfs-paths"
      - name: Check the controller layout parser with the undefined-behavior sanitizer
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all tests/test_controller_map.c -o "$RUNNER_TEMP/test-controller-map"
          "$RUNNER_TEMP/test-controller-map"
      - name: Check the Android dual-screen companion's game-state reader with the undefined-behavior sanitizer
        run: |
          cc -std=gnu11 -Wall -Wextra -Werror -D_GNU_SOURCE -DTOTK_GAME_V143=1 -Igames/totk/runtime -fsanitize=undefined -fno-sanitize-recover=all \
            games/totk/tests/companion/test_companion.c games/totk/runtime/companion_snapshot.c -o "$RUNNER_TEMP/test-companion" -lm
          "$RUNNER_TEMP/test-companion"

  lowram-android:
    if: github.ref_name == 'exp/totk-lowram-custom-touch' || github.head_ref == 'exp/totk-lowram-custom-touch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Linux host-test dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang llvm lld cmake ninja-build pkg-config libvulkan-dev mesa-vulkan-drivers glslang-tools spirv-tools libssl-dev zlib1g-dev unzip zip rsync lsof
          mkdir -p "$RUNNER_TEMP/host-compiler"
          ln -s "$(command -v clang)" "$RUNNER_TEMP/host-compiler/cc"
          ln -s "$(command -v clang++)" "$RUNNER_TEMP/host-compiler/c++"
          echo "$RUNNER_TEMP/host-compiler" >> "$GITHUB_PATH"
          echo 'CC=clang' >> "$GITHUB_ENV"
          echo 'CXX=clang++' >> "$GITHUB_ENV"
      - name: Reconstruct exact APK sources and verify touch controls
        shell: bash
        run: |
          set -euo pipefail
          echo 'c6a2ea6bd986cbee4ef3858618e3fcd826dbcb2a3b548295e3826a94f89a4708  totk_lowram_custom_touch_source.zip' | sha256sum -c -
          unzip -q totk_lowram_custom_touch_source.zip -d "$RUNNER_TEMP/patch"
          git clone https://github.com/GTomasel/totk-android-low-ram.git "$RUNNER_TEMP/lowram"
          git -C "$RUNNER_TEMP/lowram" checkout --detach efe6e56711a8d4bfe56b041ec5ac2060c127b531
          git clone https://github.com/UsingUrWifi/totk-android.git "$RUNNER_TEMP/old-touch"
          git -C "$RUNNER_TEMP/old-touch" checkout --detach 1a94b537ed5c3060793b8f998e3dc1c036a040d8
          cd "$RUNNER_TEMP/patch/totk_touch_patch"
          mkdir -p test-classes
          javac -d test-classes TouchBindings.java TouchBindingsProbe.java
          java -cp test-classes com.aure.totk.TouchBindingsProbe
          python3 apply.py "$RUNNER_TEMP/lowram" "$RUNNER_TEMP/old-touch" --check
          python3 apply.py "$RUNNER_TEMP/lowram" "$RUNNER_TEMP/old-touch"
          python3 "$GITHUB_WORKSPACE/tools/lowram_framegen_v2.py" "$RUNNER_TEMP/lowram"
          git -C "$RUNNER_TEMP/lowram" diff --check
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Pin .NET SDK 10 for translator
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/lowram"
          sdk=$(dotnet --list-sdks | awk '$1 ~ /^10\.[0-9]+\.[0-9]+$/ {print $1}' | sort -V | tail -1)
          test -n "$sdk"
          if [ -f global.json ]; then
            python3 -c 'import json,sys; p="global.json"; d=json.load(open(p)); d["sdk"]={"version":sys.argv[1],"rollForward":"disable"}; open(p,"w").write(json.dumps(d)+"\n")' "$sdk"
          else
            printf '{"sdk":{"version":"%s","rollForward":"disable"}}\n' "$sdk" > global.json
          fi
          test "$(dotnet --version)" = "$sdk"
          dotnet --version
      - name: Adapt host-only fixtures for custom touch and synthetic sysfs
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/lowram"
          python3 - <<'PY'
          from pathlib import Path
          
          def edit(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"Fixture anchor mismatch: {path}: {old[:80]}")
              p.write_text(text.replace(old, new, 1))
          
          # The extracted-method probes exercise display/menu behavior, not Android
          # panel rendering. Supply the isolated collaborator, as for GameFeedback.
          edit("tests/test_android_game_display.py",
               "+ 'PresentationController companion = new PresentationController();\\n' + callbacks",
               "+ 'PresentationController companion = new PresentationController();\\nvoid hideTouchPanel() {} void scheduleTouchPanel() {}\\n' + callbacks")
          edit("tests/test_android_frame_rate_hint.py",
               "    void ensureMainDisplay() {} void showUpdate() {}",
               "    void ensureMainDisplay() {} void showUpdate() {}\n    void hideTouchPanel() {} void scheduleTouchPanel() {}")
          edit("tests/test_android_game_menu.py",
               "    boolean isFinishing() { return finishing; }",
               "    boolean isFinishing() { return finishing; }\n    void hideTouchPanel() {} void scheduleTouchPanel() {}")
          # Companion fixture compiles the real activity against host framework doubles.
          # The display/queue are absent here; panel rendering is outside this fixture.
          p = "tests/test_companion_gate.py"
          edit(p, "STUBS = {", """STUBS = {
              'android/os/IBinder.java': 'package android.os; public interface IBinder {}',
              'android/view/Gravity.java': 'package android.view; public final class Gravity { public static final int TOP=48, START=8388611; }',
              'android/graphics/PixelFormat.java': 'package android.graphics; public final class PixelFormat { public static final int TRANSLUCENT=-3; }',
              'android/util/DisplayMetrics.java': 'package android.util; public final class DisplayMetrics { public int widthPixels, heightPixels; }',
              'android/content/res/Resources.java': 'package android.content.res; public class Resources { public android.util.DisplayMetrics getDisplayMetrics() { return new android.util.DisplayMetrics(); } }',
              'com/aure/totk/TouchControlsView.java': '''package com.aure.totk;
          final class TouchControlsView extends android.view.View {
              TouchControlsView(android.app.Activity owner) {}
              Object getParent() { return null; }
              void resetInput() {}
          }''',""")
          edit(p, "    public Context getApplicationContext() { return this; }",
               "    public Context getApplicationContext() { return this; }\n    public android.content.res.Resources getResources() { return new android.content.res.Resources(); }")
          edit(p, "    public static int w(String tag, String message) { return 0; }",
               "    public static int w(String tag, String message) { return 0; }\n    public static int i(String tag, String message) { return 0; }\n    public static int e(String tag, String message, Throwable error) { return 0; }")
          edit(p, "    public boolean isAttachedToWindow() { return false; }",
               "    public boolean isAttachedToWindow() { return false; }\n    public android.os.IBinder getWindowToken() { return null; }\n    public boolean post(Runnable callback) { return true; }")
          edit(p, "    class LayoutParams { public float preferredRefreshRate; }",
               """    class LayoutParams {
                  public float preferredRefreshRate;
                  public static final int MATCH_PARENT=-1, TYPE_APPLICATION_PANEL=1000, FLAG_NOT_FOCUSABLE=8,
                      FLAG_NOT_TOUCH_MODAL=32, FLAG_LAYOUT_IN_SCREEN=256, FLAG_FULLSCREEN=1024;
                  public android.os.IBinder token; public int gravity;
                  public LayoutParams() {}
                  public LayoutParams(int w, int h, int type, int flags, int format) {}
                  public void setTitle(String title) {}
              }
              default void addView(View view, LayoutParams params) { throw new AssertionError("no display in companion fixture"); }
              default void removeViewImmediate(View view) { throw new AssertionError("no display in companion fixture"); }""")
          edit(p, "    public Window getWindow() { return new Window(); }",
               "    public Window getWindow() { return new Window(); }\n    public android.view.WindowManager getWindowManager() { return new android.view.WindowManager() {}; }")
          
          # Use an isolated copy of the real benchmark scripts with a synthetic sysfs
          # tree. Retain the real broker, signal, input and timing assertions.
          p = "tests/test_bench_tools.py"
          edit(p, "import signal\n", "import signal\nimport shutil\n")
          edit(p, "                process = subprocess.Popen(['sh', str(BENCH / 'pan.sh'), '-s', 'x', '--device', 'test',",
               """                bench = dev.dir / 'bench'
                          shutil.copytree(BENCH, bench, ignore=shutil.ignore_patterns('__pycache__'))
                          sysfs = dev.dir / 'sysfs'
                          policy = sysfs / 'cpu/policy0'
                          policy.mkdir(parents=True)
                          for name, value in {
                              'related_cpus': '0 1 2 3', 'scaling_min_freq': '902400',
                              'scaling_max_freq': '2016000', 'cpuinfo_max_freq': '2016000',
                          }.items():
                              (policy / name).write_text(value + '\\n')
                          script = bench / 'bench_input.sh'
                          data = script.read_text()
                          for old, new in (
                              ('/sys/devices/system/cpu/cpufreq', sysfs / 'cpu'),
                              ('/sys/class/kgsl', sysfs / 'kgsl'),
                              ('/sys/class/devfreq', sysfs / 'devfreq'),
                          ):
                              if old not in data:
                                  raise AssertionError(f'missing sysfs fixture anchor: {old}')
                              data = data.replace(old, str(new))
                          script.write_text(data)
                          process = subprocess.Popen(['sh', str(bench / 'pan.sh'), '-s', 'x', '--device', 'test',""")
          
          # Unused argument in the fake callback; preserve -Werror and UBSan.
          edit("games/totk/tests/companion/test_companion.c",
               "    (void)a4; (void)a5;\n    T.calls++;",
               "    (void)a0; (void)a4; (void)a5;\n    T.calls++;")
          PY
      - name: Install pinned source test requirements
        run: python -m pip install -r "$RUNNER_TEMP/lowram/games/totk/requirements.txt"
      - name: Run complete source regression suite on Linux
        id: suite
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/lowram"
          python -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/lowram-regressions.log"
      - name: Check native path parser with UBSan
        if: ${{ !cancelled() && (steps.suite.outcome == 'success' || steps.suite.outcome == 'failure') }}
        shell: bash
        run: |
          cd "$RUNNER_TEMP/lowram"
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all tests/test_romfs_paths.c -o "$RUNNER_TEMP/test-romfs-paths"
          "$RUNNER_TEMP/test-romfs-paths"
      - name: Check controller map with UBSan
        if: ${{ !cancelled() && (steps.suite.outcome == 'success' || steps.suite.outcome == 'failure') }}
        shell: bash
        run: |
          cd "$RUNNER_TEMP/lowram"
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all tests/test_controller_map.c -o "$RUNNER_TEMP/test-controller-map"
          "$RUNNER_TEMP/test-controller-map"
      - name: Check Android companion game-state reader with UBSan
        if: ${{ !cancelled() && (steps.suite.outcome == 'success' || steps.suite.outcome == 'failure') }}
        shell: bash
        run: |
          cd "$RUNNER_TEMP/lowram"
          clang -std=gnu11 -Wall -Wextra -Werror -D_GNU_SOURCE -DTOTK_GAME_V143=1 -Igames/totk/runtime -fsanitize=undefined -fno-sanitize-recover=all games/totk/tests/companion/test_companion.c games/totk/runtime/companion_snapshot.c -o "$RUNNER_TEMP/test-companion" -lm
          "$RUNNER_TEMP/test-companion"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && (steps.suite.outcome == 'success' || steps.suite.outcome == 'failure') }}
        with:
          name: lowram-source-regression-log
          path: ${{ runner.temp }}/lowram-regressions.log
          retention-days: 3
