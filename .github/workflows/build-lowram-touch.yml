name: Build TotK Low RAM Touch
on:
  workflow_dispatch:
  push:
    branches: ['exp/totk-lowram-custom-touch']
    paths:
      - '.github/workflows/build-lowram-touch.yml'
      - 'totk_lowram_custom_touch_source.zip'
permissions:
  contents: read
concurrency:
  group: lowram-touch-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.ref == 'refs/heads/exp/totk-lowram-custom-touch'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify source bundle, clone pinned sources, and apply patch
        shell: bash
        run: |
          set -euo pipefail
          echo 'c6a2ea6bd986cbee4ef3858618e3fcd826dbcb2a3b548295e3826a94f89a4708  totk_lowram_custom_touch_source.zip' | sha256sum -c -
          unzip -q totk_lowram_custom_touch_source.zip -d "$RUNNER_TEMP/patch"
          git clone https://github.com/GTomasel/totk-android-low-ram.git "$RUNNER_TEMP/lowram"
          git -C "$RUNNER_TEMP/lowram" checkout --detach efe6e56711a8d4bfe56b041ec5ac2060c127b531
          git clone https://github.com/UsingUrWifi/totk-android.git "$RUNNER_TEMP/old-touch"
          git -C "$RUNNER_TEMP/old-touch" checkout --detach 1a94b537ed5c3060793b8f998e3dc1c036a040d8
          cd "$RUNNER_TEMP/patch/totk_touch_patch"
          mkdir -p test-classes
          javac -d test-classes TouchBindings.java TouchBindingsProbe.java
          java -cp test-classes com.aure.totk.TouchBindingsProbe
          python3 apply.py "$RUNNER_TEMP/lowram" "$RUNNER_TEMP/old-touch" --check
          python3 apply.py "$RUNNER_TEMP/lowram" "$RUNNER_TEMP/old-touch"
          git -C "$RUNNER_TEMP/lowram" diff --check
          git -C "$RUNNER_TEMP/lowram" status --short
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Pin .NET SDK 10 for translator
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/lowram"
          sdk=$(dotnet --list-sdks | awk '$1 ~ /^10\.[0-9]+\.[0-9]+$/ {print $1}' | sort -V | tail -1)
          test -n "$sdk"
          if [ -f global.json ]; then
            python3 -c 'import json,sys; p="global.json"; d=json.load(open(p)); d["sdk"]={"version":sys.argv[1],"rollForward":"disable"}; open(p,"w").write(json.dumps(d)+"\n")' "$sdk"
          else
            printf '{"sdk":{"version":"%s","rollForward":"disable"}}\n' "$sdk" > global.json
          fi
          test "$(dotnet --version)" = "$sdk"
          dotnet --version
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential git cmake ninja-build rsync pkg-config clang lld llvm libicu-dev zlib1g-dev libssl-dev unzip zip autoconf automake libtool
          python -m pip install 'cryptography==50.0.2'
      - name: Configure Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Fetch and verify pinned open-source Turnip driver
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/upstream.apk" 'https://github.com/AurelioB/totk-android/releases/download/v1.0.1/TotK-Native-1.0.1.apk'
          unzip -p "$RUNNER_TEMP/upstream.apk" 'lib/arm64-v8a/libtotk_turnip.so' > "$RUNNER_TEMP/turnip.so"
          echo "9b87afeb3d8d30c6a0ad5aab3e0703bc1500e0321e9f17a922106fa556389ec6  $RUNNER_TEMP/turnip.so" | sha256sum -c -
      - name: Build and sign separately installable APK
        shell: bash
        env:
          TOTK_TOUCH_SIGNING_PEM: ${{ secrets.TOTK_TOUCH_SIGNING_PEM }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$TOTK_TOUCH_SIGNING_PEM" || { echo '::error::Missing TOTK_TOUCH_SIGNING_PEM Actions secret'; exit 1; }
          key="$RUNNER_TEMP/totk-test-signing.pem"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$TOTK_TOUCH_SIGNING_PEM" > "$key"
          unset TOTK_TOUCH_SIGNING_PEM
          openssl pkey -in "$key" -noout
          openssl x509 -in "$key" -noout
          cd "$RUNNER_TEMP/lowram"
          python3 games/totk/android/build_release.py --ndk "$ANDROID_NDK_HOME" --turnip "$RUNNER_TEMP/turnip.so" --key "$key" --package com.aure.totk.lowram.touch --label 'TotK Low RAM Touch' --version-name '1.1.2-touch-v1' --version-code "$((110200 + GITHUB_RUN_NUMBER))" --jobs 4 --out "$GITHUB_WORKSPACE/TotK-LowRAM-Touch.apk"
          cd "$GITHUB_WORKSPACE"
          sha256sum TotK-LowRAM-Touch.apk > TotK-LowRAM-Touch.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: TotK-LowRAM-Touch-APK
          path: |
            TotK-LowRAM-Touch.apk
            TotK-LowRAM-Touch.apk.sha256
          retention-days: 3
